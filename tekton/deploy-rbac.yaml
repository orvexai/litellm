apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-deployer-admin
  namespace: litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: litellm-deployer
    namespace: default
