---
# Build and deploy on push to `main`. A standalone Trigger discovered by the
# platform github-webhook-listener (label ci.my-idp/discover: "true"), same as
# artifact-server-ci. No per-repo EventListener, webhook, ingress or secret.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: litellm-build-template
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: litellm-fork
spec:
  params:
    - name: git-url
      default: https://github.com/orvexai/litellm.git
    - name: git-revision
      default: main
    - name: image-tag
      default: orvex
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: litellm-build-
        namespace: tekton-pipelines
        labels:
          app.kubernetes.io/name: litellm-build
          tekton.dev/pipeline: litellm-build
      spec:
        pipelineRef:
          name: litellm-build
        params:
          - name: repo-url
            value: $(tt.params.git-url)
          - name: revision
            value: $(tt.params.git-revision)
          - name: image-tag
            value: $(tt.params.image-tag)
        taskRunTemplate:
          serviceAccountName: tekton-smoke-test-builder
          podTemplate:
            securityContext:
              fsGroup: 1000
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteMany
                resources:
                  requests:
                    storage: 10Gi
                storageClassName: rook-cephfs
          - name: dockerconfig
            secret:
              secretName: tekton-harbor-credentials
          - name: gitops-credentials
            secret:
              secretName: omnigent-gitops-write-credentials
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: litellm-build-main
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: litellm-fork
    ci.my-idp/discover: "true"
spec:
  interceptors:
    - ref:
        name: github
        kind: ClusterInterceptor
      params:
        - name: secretRef
          value:
            secretName: github-webhook-secret
            secretKey: secret
        - name: eventTypes
          value: ["push"]
    - ref:
        name: cel
        kind: ClusterInterceptor
      params:
        - name: filter
          value: "body.repository.full_name == 'orvexai/litellm' && body.ref == 'refs/heads/main' && !body.deleted"
        - name: overlays
          value:
            - key: image-tag
              expression: "'orvex-' + body.after.truncate(12)"
  bindings:
    - ref: github-push-defaults
      kind: ClusterTriggerBinding
    - kind: TriggerBinding
      name: image-tag
      value: $(extensions.image-tag)
  template:
    ref: litellm-build-template
