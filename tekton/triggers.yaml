apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-build-trigger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-build-trigger-eventlistener
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
subjects:
  - kind: ServiceAccount
    name: litellm-build-trigger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litellm-build-trigger-eventlistener-clusterroles
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
subjects:
  - kind: ServiceAccount
    name: litellm-build-trigger
    namespace: default
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: litellm-github-push
spec:
  params:
    - name: repo-url
      value: $(body.repository.clone_url)
    - name: revision
      value: $(body.after)
    - name: tag
      value: $(extensions.short_sha)
    - name: deploy
      value: $(extensions.deploy)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: litellm-build
spec:
  params:
    - name: repo-url
    - name: revision
    - name: tag
    - name: deploy
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: litellm-build-
      spec:
        pipelineRef:
          name: litellm-build
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: revision
            value: $(tt.params.revision)
          - name: image
            value: ghcr.io/orvexai/litellm
          - name: tag
            value: $(tt.params.tag)
          - name: deploy
            value: $(tt.params.deploy)
        taskRunTemplate:
          serviceAccountName: litellm-deployer
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 10Gi
          - name: registry-credentials
            secret:
              secretName: registry-credentials
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: litellm-github
spec:
  serviceAccountName: litellm-build-trigger
  triggers:
    - name: push
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secret
            - name: eventTypes
              value: [push]
        - ref:
            name: cel
          params:
            - name: filter
              value: "!body.deleted"
          overlays:
            - key: short_sha
              expression: "body.after.truncate(12)"
            - key: deploy
              expression: "body.ref == 'refs/heads/main' ? 'true' : 'false'"
      bindings:
        - ref: litellm-github-push
      template:
        ref: litellm-build
